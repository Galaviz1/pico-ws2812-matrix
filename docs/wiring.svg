<text class="m" x="470" y="440">USB powers the panel through VBUS; the firmware</text>
<text class="m" x="470" y="456">caps it at 300 mA. For more brightness, feed the</text>
<text class="m" x="470" y="472">panel from a 5 V 2-4 A supply instead, join its GND</text>
<text class="m" x="470" y="488">to the Pico GND, and raise MAX_MA in config.py.</text>
