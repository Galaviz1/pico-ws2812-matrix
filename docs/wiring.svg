<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Wiring: Pico GP2 (pin 4) through a 330 ohm resistor to the panel DIN; Pico VBUS (pin 40) to the panel 5V; Pico GND (pin 38) to the panel GND; a 1000 microfarad capacitor across the panel 5V and GND.">
